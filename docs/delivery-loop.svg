<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="330" viewBox="0 0 1220 330" role="img" aria-labelledby="title desc">
  <title id="title">Project MS 完整交付闭环</title>
  <desc id="desc">定义里程碑、拆解计划、执行任务、治理风险、提交成果、确认交付。改期先预览，验收未通过则退回执行，必要成果失效则重新核查。</desc>
